services:
  ollama:
    image: ollama/ollama:latest
    container_name: uicmp_ollama
    volumes:
      # ~6GB of model blobs live in a named volume, not the writable layer.
      - ollama_models:/root/.ollama
    environment:
      # <=8GB VRAM: never hold more than one model, never batch.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # Keep the VLM resident between the classify and grounding calls.
      # Set to "0" if PaddleOCR-GPU is fighting it for VRAM.
      OLLAMA_KEEP_ALIVE: "10m"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [uicmp]
    restart: unless-stopped

  app:
    build: .
    image: ui_comparison:gpu
    container_name: uicmp_app
    # Match your host uid/gid so files written to output/ are yours, not root's.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace

    # --- sandbox ---
    read_only: true                      # entire rootfs read-only
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=512m,mode=1777

    volumes:
      # Source code: a host bind mount, so it is never in the container's writable
      # layer and never in an image layer. Read-write because this is the dev machine —
      # pytest, formatters and git need to write here. Edit it on the host as normal.
      - ${CODE_DIR}:/workspace
      # Nested mounts. Docker applies mounts longest-path-last, so these override
      # the parent mount for their subtrees.
      - ${DATA_DIR}/input:/workspace/input:ro
      - ${DATA_DIR}/output:/workspace/output
      # HOME — PaddleOCR/HF model caches. Persisted so models download once, not per run.
      - app_cache:/cache

    environment:
      OLLAMA_HOST: "http://ollama:11434"
      # Keeps container-generated __pycache__ out of the source tree you edit on the
      # host — stale .pyc from a different interpreter is a confusing failure mode.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/workspace"
      HOME: "/cache"
      # CPU thread caps for PaddleOCR/OpenMP/OpenCV. Set to your physical core count.
      OMP_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    depends_on: [ollama]
    networks: [uicmp]
    stdin_open: true
    tty: true

volumes:
  ollama_models:
  app_cache:

networks:
  uicmp:
