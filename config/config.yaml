# Thresholds and model settings (design.md §13, rules.md §15).
# Values below are the design-doc starting points — not yet experimentally
# calibrated; expect to tune these once real comparisons are run.

ocr:
  confidence_warning: 0.60
  confidence_accept: 0.85

matching:
  minimum_match_score: 0.70
  # An element that changed size defeats IoU: shortening a section title from
  # "Action Crime" to "Action" drops IoU to 0.29 and the pair falls to 0.66,
  # under the 0.70 threshold - so the size change prevents the match that would
  # have reported the text change. The iou term is therefore the better of true
  # IoU and this fraction of intersection-over-smaller-box. Below 1.0 because
  # containment is weaker evidence: a small box sits inside any large box it
  # overlaps. 0 restores plain IoU.
  containment_credit: 0.5
  weights:
    class: 0.25
    text: 0.25
    spatial: 0.2
    iou: 0.2
    context: 0.1
  # A whole panel often moves as one piece between two builds: on the SunNXT
  # language screen the bottom sheet sits ~136 px (0.058) lower in the client
  # while the header behind it moved only ~10 px. Judged per element that is
  # six position findings plus 7 of 8 tiles failing to match, because a
  # text-less card scores ~0.62 once IoU collapses. So the shift is estimated
  # per layout-graph container from its own matched anchors, reported once,
  # and subtracted before the second matching pass.
  # enabled: false reproduces the pre-Phase-12.2 output exactly.
  group_shift:
    enabled: true
    # Below this many anchors a container's shift is not trustworthy, so the
    # next container up the CONTAINS chain is tried instead. 2, not 3: the
    # layout tree splits a panel into rows of two, so 3 sent every lookup up
    # to the screen root, i.e. back to one global shift.
    min_anchors: 2
    # An anchor must be unambiguous: same class plus either near-identical
    # text or boxes that still overlap.
    anchor_min_text_score: 0.9
    anchor_min_iou: 0.5
    # Every anchor must lie within this of the median dx/dy, or the members did
    # not move as one piece and no shift is applied. 0.01 = 10.8 px wide.
    max_spread_norm: 0.01

comparison:
  structural_similarity_threshold: 0.5
  # STRUCTURAL_DIFFERENCE has no row in test_cases_pass_fail.md and fired on 9
  # of 18 matched pairs on the SunNXT language pair: two screens with different
  # element counts cannot share a graph neighbourhood, so it restates what B1/B2
  # already report. Turn on to debug matching, not for a real verdict.
  report_structural_difference: false
  # PASS/REVIEW/FAIL bands from docs/test_cases_pass_fail.md — proposed
  # defaults, not yet confirmed by the manager.
  # C1: center distance as a fraction of the screen diagonal.
  # <= pass → PASS, <= fail → REVIEW, > fail → FAIL (Major if > major, else Minor).
  position_bands: {pass: 0.01, fail: 0.03, major: 0.06}
  # Looser for content_card boxes from VLM grounding (~4% drift observed
  # between runs on ss012, see memory.md).
  vlm_grounded_position_bands: {pass: 0.04, fail: 0.08, major: 0.12}
  # C2: max(width, height) relative change. <= pass PASS, <= fail REVIEW, else FAIL Major.
  size_bands: {pass: 0.05, fail: 0.15}
  # E1: label text is compared only for these classes; everything else is
  # dynamic content (§H). Exact match PASS, one-character slip REVIEW, else FAIL.
  static_text_classes: [tab_item, button, section_title, search_bar]
  # B1: missing element of these classes is Critical (others Major).
  critical_classes: [button, tab_item, navigation_bar, logo]
  # A1-A5 screen-level checks (src/comparison/screen_checks.py): the two images
  # compared as whole frames, before any detection.
  screen:
    # A2: more than this share of the frame in one colour, or fewer than
    # edge_density_min pixels on a luminance step, means a blank or broken
    # render. 0.90 is the spec's own wording; edge_density_min is a deliberately
    # safe floor and is NOT yet calibrated against real screenshots - a sparse
    # splash screen must not trip it.
    dominant_colour_fraction_max: 0.90
    edge_density_min: 0.005
    # A3: below this mean luminance (status bar excluded) the screen reads dark.
    # Real OTT dark themes sit at 0.05-0.20 and light ones at 0.85-0.95, so the
    # boundary is far from either cluster; slightly under 0.5 because a dark app
    # with a bright hero banner pulls the mean up more often than the reverse.
    dark_luminance_max: 0.45
    # A5: aspect difference relative to the client. A pure resolution change at
    # the same aspect is a device difference, not a defect, and is not reported.
    aspect_bands: {pass: 0.05, fail: 0.15}
  # D1/D2/D5 colour (src/comparison/color_checks.py), CIELAB dE2000. dE ~1 is
  # the just-noticeable difference, under 2 nobody spots it, 2-5 is visible side
  # by side, over 5 is obvious. Brand and background get the tight band because
  # a designer eyeballs those against a swatch; a badge is small, anti-aliased
  # and Minor, so failing a build over a shade of it is not worth it.
  color:
    brand_bands: {pass: 3.0, fail: 6.0}       # D1 - matched chrome
    background_bands: {pass: 3.0, fail: 6.0}  # D2 - page background
    badge_bands: {pass: 5.0, fail: 10.0}      # D5 - overlay badges
    # Chrome whose fill colour is worth comparing. Never a content/cast/
    # celebrity card: poster artwork is dynamic content (rules.md §2).
    brand_classes: [button, logo, navigation_bar, tab_item, search_bar]
    # Centre fraction of a crop sampled, so anti-aliased rims and rounded
    # corners cannot drag the fill toward the background.
    inset_fraction: 0.25
    badge_inset_fraction: 0.15
  # B3/B4/B5/B8 structure (src/comparison/layout_checks.py), read off the layout
  # graph both sides already build - no new extraction.
  layout:
    # B5 fires on how much an alignment LOOSENED, not on absolute offset: the
    # client's own ALIGNED_WITH clusters are built at graph.alignment_epsilon_norm
    # (0.02), which is looser than B5's 1.5%, so an absolute test would flag pairs
    # the client never aligned tightly in the first place.
    alignment_tolerance_norm: 0.015
    # Fewest items in a bar where order can meaningfully differ.
    min_tab_items: 2

vlm:
  model: qwen2.5vl:7b
  # v2 is classify-only (class/text/description/approximate_location, no
  # bbox) — VLM-grounded bboxes were found non-deterministic across
  # repeated calls (see src/fusion/fuse.py docstring). v1_qwen2.5vl still
  # exists for VLMEngine.analyze_grounded_experimental() only.
  prompt_version: v2_qwen2.5vl_classify_only
  # null = send native resolution, no downscale before the VLM. Previously
  # 1280, because full 2400px height produced ~3661 vision tokens and hit
  # cudaMalloc failed: out of memory on an 8GB GTX 1070 with this 7B model.
  # Set back to a pixel value (e.g. 1280) if you hit that OOM again.
  max_image_dim: null
  # 2048 truncated a real ~40-element screen mid-list (done_reason="length");
  # 4096 gives real screens enough room, at the cost of a longer CPU run.
  num_predict: 4096
  num_ctx: 8192
  # A real pipeline run found "text" coming back null for EVERY element,
  # including ones OCR read at high confidence in the same run. Research
  # (arXiv:2408.02442, "Let Me Speak Freely?") documents schema/grammar-
  # constrained decoding biasing a nullable field toward its null branch
  # even when the model could report a real value. use_json_schema: false
  # sidesteps that mechanism entirely (free-form generation + robust
  # parsing, same approach the earlier reference VLM interface used).
  use_json_schema: false
  # Only consulted when use_json_schema: true — drops null from the
  # schema's "text" type (paired prompt change: says "" instead of null)
  # as a lighter-weight alternative mitigation.
  nullable_text_in_schema: true

fusion:
  # Text-based OCR<->VLM matching (section_title, tab_item, logo, title, ...)
  text_similarity_threshold: 0.6
  # Badge keywords deliberately narrow — expand only with evidence from
  # real screenshots, a broad list risks false-positive badge detection.
  badge_keywords: [free, new]
  # Card boxes are grid-inferred (approximate row bounds), so a badge near
  # a card's edge needs generous tolerance to register as "inside" it.
  badge_containment_padding: 40
  # Detector-first fusion: OCR text in no detection whose center is in this
  # top fraction of the screen is the phone status bar (clock, battery) —
  # tagged ignored (test_cases §H) instead of uncertain, so it neither
  # triggers the VLM nor becomes a REVIEW. 0.04 of 2400px = 96px.
  status_bar_height_norm: 0.04

graph:
  containment_min_overlap: 0.9
  # Was 0.01 (10.8px at 1080 wide), which sat *inside* the detector's own
  # noise: on ss031 the left card column spans x=9.1..21.6, so a 12.5px
  # jitter split one column into two alignment groups, and el_0004 came out
  # ALIGNED_WITH exactly one of its three column-mates (10.1px) but not the
  # other two (11.8, 12.5px). 0.02 = 21.6px clears the measured jitter.
  alignment_epsilon_norm: 0.02
  adjacency_max_gap_norm: 0.05
  # Layout-tree builder (src/graph/layout.py): two boxes share a row/column
  # band when their spans overlap by at least this fraction of the shorter.
  band_min_overlap: 0.5
  # Layout-tree builder: an element within this distance (x image width) of
  # the content edge or of a navigation_bar / floating overlay is marked
  # `clipped` (cut off by scroll position). 0.005 of 1080px = ~5px.
  edge_margin_norm: 0.005
  # Layout-tree builder: fallback parent when nothing covers an element at
  # containment_min_overlap. Badges overhanging a card sit 85-86% inside it
  # (sunnxt_test_ss); floating pills overlap a card by < 50%, so stay out.
  loose_containment_overlap: 0.75
  # Layout-tree builder: a child covering >= 2 siblings, each by at least
  # this share of the smaller box, is a floating overlay (e.g. a chip bar
  # over a carousel), not a member of their row. The ss031 nav bar's 1px
  # overlap with the last card row is far below it.
  float_min_overlap: 0.1
  # NEAR edges: each node linked to its K nearest neighbours by Euclidean
  # distance over both bbox corners (graph_paper.pdf §3.2). Threshold-free,
  # so unlike ALIGNED_WITH it cannot be defeated by detector jitter. The
  # paper tunes K=6 for desktop and K=5 for mobile; these screens are mobile.
  # 0 disables. Nothing consumes NEAR yet - it is the substrate for the
  # paper's recursive neighbour matching (§3.3).
  knn_k: 5
