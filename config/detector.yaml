# UI element detector (src/detector/) — settings for the model bundle
# produced by the UI_Detection_model_training repo (its docs/INTERFACE.md).
#
# main.py runs this first for every screen; fusion then hangs OCR text on
# the detections (FusionEngine.fuse_detections).

# gt_stub: replays hand labels from gt_detections.json — a perfect detector,
#          so any bug found with it is a pipeline bug, not a detection error.
#          Only knows the 103 labelled screenshots, by file name.
# yolo:    the real model, best.pt.
engine: yolo

bundle: models/ui16_v1

# YOLO needs ultralytics/torch, which must never be installed next to
# paddlepaddle-gpu. It runs in a separate Python, named by the environment
# variable UI_DETECTOR_PYTHON (set it in the shell; nothing loads .env), e.g.
#   PowerShell: $env:UI_DETECTOR_PYTHON = "C:\Users\pralhadraj.joshi\UI_Detection_model_training\.venv\Scripts\python.exe"
python_env_var: UI_DETECTOR_PYTHON

# Detector confidence -> UIElement.confidence_tier. conf/iou for inference
# itself come from the bundle's model_card.json, never from here.
confidence_high: 0.70
confidence_medium: 0.40
